apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: my-trust-bundle
spec:
  sources:
    - useDefaultCAs: true
  target:
    configMap:
      key: ca-certificates.crt
    secret:
      key: ca-certificates.crt
    namespaceSelector:
      matchLabels:
        trust.cert-manager.io/inject: "true"
